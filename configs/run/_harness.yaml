run:
  name: harness
  kind: harness
  title: Unit-test and gate harness only; do not use for reporting
toggles:
  multi_frequency_front_end: true
  substrate_integrated_electrodes: true
  coverage_covariate: true
  split_chip_replication: true
  decoupling_ladders: true
  artefact_confound_channel: true
  treatment_stratified_calibration: true
  errors_in_variables_correction: true
  d_optimal_allocation: true
  two_axis_state: true
  damping: true
  commanded_flow_step_excitation: true
  perfusion: true
harness:
  devices: 48
  biological_devices: 24
  held_out_devices: 6
  acellular_devices: 12
  coverage_devices: 8
  cell_free_devices: 4
  batches: 3
  operators: 2
  timepoints: [3, 7, 14, 21]
  budget_fractions: [0.25, 0.50, 0.75, 1.00]
  latent_state_dimension: 4
  training_steps: 2
  horizons_days: [1, 3]
  bootstrap_replicates: 24
  random_seeds: 8
seed: 7
