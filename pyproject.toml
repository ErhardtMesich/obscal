[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obscal"
version = "1.0.0"
description = "Calibration, terminal-assay allocation and forecasting for the ObsCal perfused hepatocyte-stellate fibrosis chip"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ObsCal instrument group" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.6", "black>=24.0", "isort>=5.13"]

[project.scripts]
obscal-cohort = "obscal.cli.build_cohort:main"
obscal-calibrate = "obscal.cli.calibrate:main"
obscal-allocate = "obscal.cli.allocate:main"
obscal-forecast = "obscal.cli.forecast:main"
obscal-verify = "obscal.cli.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "RET", "C4", "PIE", "TID"]
ignore = ["E501", "B905"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = false
known_first_party = ["obscal"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["build", "dist"]
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
